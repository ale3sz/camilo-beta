                {SUCURSALES.map((s) => (
                  <div
                    key={s.num}
                    className="editorial-card bg-[#FAF6F0] border-[2px] border-[#111111] rounded-[22px] p-6 flex flex-col justify-between shadow-[0_5px_0_#111111] h-full"
                  >
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-4">
                        <span className="font-display text-lg text-[#111111]">{s.num}.</span>
                        <span
                          className={`whitespace-nowrap text-[10.5px] font-extrabold uppercase px-3 py-1 rounded-full border border-[#111111] ${
                            s.accent ? 'bg-[#E86A1C] text-white' : 'bg-[#E8DFD1] text-[#111111]'
                          }`}
                        >
                          {s.badge}
                        </span>
                      </div>
                      <h3 className="text-[19px] xl:text-[20.5px] font-extrabold text-[#111111] leading-snug">
                        {s.name}
                      </h3>
                      <p className="text-[13px] font-bold text-[#E86A1C] mt-1">
                        {s.area}
                      </p>
                    </div>

                    <div className="pt-3 mt-5 border-t border-[#111111]/15">
                      <p className="text-[12.5px] font-semibold text-[#4A443D] whitespace-nowrap">
                        Horario: {s.hours}
                      </p>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ==================================================================
              9. FOOTER DE MARCA (Anillo crema en logo sobre fondo oscuro)
          ================================================================== */}
          <footer className="bg-[#111111] text-[#D8CFC2] py-10 px-5 sm:px-10 border-t-[2px] border-[#111111]">
            <div className="max-w-[1360px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <img
                  src="assets/logo_oficial.jpg"
                  alt="Camilo Café Artesanal"
                  className="w-12 h-12 rounded-full object-cover border-2 border-[#F3ECE1]/40 shadow-md"
                />
                <div>
                  <div className="text-white font-extrabold text-sm">CAMILO · Café Artesanal</div>
                  <div className="text-xs text-[#9E9589]">Rosario & Funes · @cafe.camilo (+107K seguidores)</div>
                </div>
              </div>
              <div className="text-xs font-semibold text-[#9E9589]">
                Maqueta Visual Oficial · Identidad & Fotografía XXL
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
